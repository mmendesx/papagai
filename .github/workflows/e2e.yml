name: E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --project tsconfig.build.json --noEmit

      - name: Unit tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: e2e-integration-secret
          APP_KEY: ci-app-key

      - name: Run e2e tests
        env:
          NODE_ENV: test
          JWT_SECRET: e2e-integration-secret
          APP_KEY: ci-app-key
          BASE_URL: http://localhost:3000
        run: npm run test:e2e
