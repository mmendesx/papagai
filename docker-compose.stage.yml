name: papagai-stage

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: papagai
      POSTGRES_PASSWORD: papagai
      POSTGRES_DB: papagai
    volumes:
      - stage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papagai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - stage_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    networks:
      - traefik
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.papagai-stage.rule=Host(`stage.papagai.icto.io`)"
      - "traefik.http.routers.papagai-stage.entrypoints=websecure"
      - "traefik.http.routers.papagai-stage.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.papagai-stage.loadbalancer.server.port=${PORT:-3000}"
      - "traefik.http.routers.papagai-stage-http.rule=Host(`stage.papagai.icto.io`)"
      - "traefik.http.routers.papagai-stage-http.entrypoints=web"
      - "traefik.http.routers.papagai-stage-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      APP_KEY: ${APP_KEY:?Set APP_KEY in your stage environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your stage environment}
      BASE_URL: ${BASE_URL:-https://stage.papagai.icto.io}

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: papagai
      DB_PASS: papagai
      DB_NAME: papagai
      DATABASE_URL: postgresql://papagai:papagai@db:5432/papagai

      INSTANCES_DIR: /app/instances
      MEDIA_DIR: /app/media
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-86400}

      REDIS_URL: redis://redis:6379

      CORS_ORIGIN: ${CORS_ORIGIN:-https://stage.papagai.icto.io}

      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-3}
      WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}

      AUTH_THROTTLE_TTL: ${AUTH_THROTTLE_TTL:-60}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-5}
    volumes:
      - stage_media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  traefik:
    external: true

volumes:
  stage_postgres_data:
  stage_redis_data:
  stage_media_data:
