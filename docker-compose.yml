services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: papagai
      POSTGRES_PASSWORD: papagai
      POSTGRES_DB: papagai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papagai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      # Required — compose fails fast if unset (no weak defaults). See README.md and .env.example.
      APP_KEY: ${APP_KEY:?Set APP_KEY in your environment or a .env file next to this compose file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or a .env file next to this compose file}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: papagai
      DB_PASS: papagai
      DB_NAME: papagai
      INSTANCES_DIR: /app/instances
      MEDIA_DIR: /app/media
      REDIS_URL: redis://redis:6379
    volumes:
      - media_data:/app/media
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  media_data:
